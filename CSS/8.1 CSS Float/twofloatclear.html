<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Clearing Float</title>
    <style>
        div{
            height : 200px;
            width : 200px;
            background-color: palegreen;
            float : left;
            margin : 0px;
            padding : 0px;

        }

        .second{
            height: 200px;
            width : 200px;
            background-color: blanchedalmond;
            float : right ;
            margin : 0px;
            padding : 0px;
            

        }
        body,p{
            margin : 0px;
            padding : 0px;
            display : inline-block;
        }

    </style>
</head>

<body>
    
    <header>Hi! lets learn about clearing float properties</header>

    </div>
    <div class ="second">
            
    </div>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    
      .flag{
      background-color:rgb(206,17,38);
      height : 600px;
      width : 900px;
      padding : 0px;
      color : white;
      text-align: center;
      font-family: 'Times New Roman', Times, serif;
      font-size: 5rem;
      font-weight: 400px;


     }

     .flag > div {
      background-color: rgb(0, 40, 104);
      height : 300px;
      width : 100%;
      position : relative;
     }

    .flag > div div p{
        background-color: white;
        height : 200px;
        width : 200px;
        border-radius: 50%;
        color : black;
        position : relative;
        left : 350px;
        top : 50px;
        
        
    
    }

    .india{
        background-color: rgb(227, 57, 38);
        height : 600px;
        width : 900px;

    }
    .india > div{
        background-color: green;
        height : 400px;
        width : 900px;
        position : relative;
        top : 200px;
   
    }

    .india > div > div{
        background-color: white;
        height : 200px;
        width : 900px;
        position : absolute;


    }
    img{
        margin-left : 320px;
    }
    


    .uae{
        background-color: black;
        height : 600px;
        width : 900px;
        position : relative;
        

    }
    .red{
        background-color: red;
        height : 100%;
        width : 280px;
        position : absolute;
        top : 0px;
        left : 0px;
        font-size: 2rem;
        color : black;

        
        
    }
    .whitepart{
        background-color: white;
        height : 33.33%;
        width : 620px;
        position :absolute;
        top : 200px;
        left : 280px;
        

    }
    .whitepart > .green{
        background-color: green;
        height : 100%;
        width : 100%;
        position :absolute;
        top : 200px;

    }

    


   
    


    
 

     
    
  </style>
</head>

  <div class="flag">

<div class = "india">
    
        
    <div>

        </div>
      </div>
      
</div>
<br><br>

<div class = "uae">
    <div class="red">

</div>

</div>



</div>
